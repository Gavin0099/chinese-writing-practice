<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF8F4">
    <title>國字學習查詢｜生字練習簿小幫手</title>
    <link rel="stylesheet" href="learning.css">
    <script type="module" src="learning.mjs"></script>
    <link rel="stylesheet" href="task-layout.css" media="screen">
    <link rel="stylesheet" href="tokens.css" media="screen">
</head>
<body>
    <header class="page-header">
        <nav class="task-nav" aria-label="學習工具">
            <a href="vocabulary.html" data-workspace-link>老師詞庫</a>
            <a href="learning.html" data-workspace-link aria-current="page">國字查詢</a>
            <a href="index.html" data-workspace-link>首頁</a>
            <details class="task-nav-more">
                <summary>資料與設定</summary>
                <div class="task-nav-menu">
                    <a href="backup.html">本機備份與還原</a>
                    <a href="sync.html">雲端同步</a>
                </div>
            </details>
        </nav>
    </header>
    <main>
        <h1>國字學習查詢</h1>
        <p class="intro">比對目前教材和同出版社的前期教材，依已確認的進度推估是否教過。</p>

        <div class="panels">
            <section class="panel" aria-labelledby="progressHeading">
                <h2 id="progressHeading">教學進度</h2>
                <p class="notice" id="catalogNotice" role="status"></p>
                <p class="notice" id="catalogMode" hidden><a id="catalogModeLink" href="sync.html">登入以載入教材</a></p>
                <button type="button" id="retryCatalog" hidden>重新載入教材</button>
                <form id="progressForm">
                    <fieldset id="progressFields" disabled>
                        <legend class="visually-hidden">教材與已教課次</legend>
                        <div class="course-fields">
                            <label class="wide">學校使用的出版社<select id="publisher" required></select></label>
                            <label>學年度<select id="academicYear"></select></label>
                            <label>年級<select id="grade"></select></label>
                            <label>學期<select id="semester"></select></label>
                            <label class="wide">教材版本<select id="edition"></select></label>
                            <label class="wide">目前教到的課次<select id="lesson" required></select></label>
                        </div>
                        <button type="submit" id="confirmProgress" class="primary" disabled>確認教學進度</button>
                    </fieldset>
                </form>
                <p class="notice" id="progressNotice" role="status"></p>
                <details id="curriculumImport" class="curriculum-import">
                    <summary>從檔案匯入本機教材</summary>
                    <label for="curriculumFiles">選擇教材 JSON</label>
                    <input id="curriculumFiles" type="file" accept=".json,application/json" multiple aria-describedby="importHelp">
                    <p id="importHelp" class="hint">選取已備妥的教材資料檔（JSON）。如有同批課次比對報告，可一起選取。檔案只存於此瀏覽器。</p>
                </details>
                <p class="notice" id="importNotice" role="status"></p>
            </section>

            <section class="panel" aria-labelledby="queryHeading">
                <h2 id="queryHeading">逐字查詢</h2>
                <form id="queryForm">
                    <fieldset id="queryFields" disabled>
                        <legend class="visually-hidden">查詢內容</legend>
                        <label for="query">輸入或貼上國字、詞語或課文</label>
                        <textarea id="query" rows="4" maxlength="1000" placeholder="例如 烏雲密布"></textarea>
                        <div class="actions">
                            <button type="submit" class="primary">查詢國字</button>
                        </div>
                    </fieldset>
                </form>
                <p class="hint">輸入的內容只在此瀏覽器處理。</p>
            </section>
        </div>

        <section class="results-section" aria-labelledby="resultsHeading">
            <h2 id="resultsHeading" hidden>查詢結果</h2>
            <p class="notice" id="queryNotice" role="status"></p>
            <p class="notice" id="reviewLookupNotice" role="status"></p>
            <div id="results" class="results"></div>
        </section>
    </main>

    <template id="resultTemplate">
        <article class="result-card">
            <div class="character"><h3></h3><span class="count"></span></div>
            <div class="assessment">
                <h4>教學進度</h4>
                <p class="teaching-status"></p>
            </div>
            <div class="evidence">
                <h4>教材收錄</h4>
                <div class="first-occurrence"></div>
                <ul class="occurrences"></ul>
                <ul class="occurrences reference-occurrences"></ul>
            </div>
            <div class="word-review" hidden>
                <h4>相關詞語的批改紀錄</h4>
                <ul class="word-review-list"></ul>
            </div>
        </article>
    </template>
</body>
</html>
