<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>國字學習查詢｜生字練習簿小幫手</title>
    <link rel="stylesheet" href="learning.css">
    <script type="module" src="learning.mjs"></script>
</head>
<body>
    <header class="page-header">
        <a href="index.html">← 生字練習簿</a>
    </header>
    <main>
        <h1>國字學習查詢</h1>
        <p class="intro">依家長確認的課次查詢教材，並記下孩子還需要練習的字。</p>

        <div class="panels">
            <section class="panel" aria-labelledby="progressHeading">
                <h2 id="progressHeading">教學進度</h2>
                <details id="curriculumImport" class="curriculum-import">
                    <summary>匯入本機教材</summary>
                    <label for="curriculumFiles">選擇教材 JSON</label>
                    <input id="curriculumFiles" type="file" accept=".json,application/json" multiple aria-describedby="importHelp">
                    <p id="importHelp" class="hint">選取資料工具產生的 candidate JSON。可一併選取同批 comparison JSON，核對完整課次。檔案內容只存於此瀏覽器。</p>
                </details>
                <p class="notice" id="importNotice" role="status"></p>
                <form id="progressForm">
                    <fieldset id="progressFields" disabled>
                        <legend class="visually-hidden">教材與已教課次</legend>
                        <div class="course-fields">
                            <label>學年度<select id="academicYear"></select></label>
                            <label>出版社<select id="publisher"></select></label>
                            <label>年級<select id="grade"></select></label>
                            <label>學期<select id="semester"></select></label>
                            <label class="wide">教材版本<select id="edition"></select></label>
                            <label class="wide">目前教到的課次<select id="lesson" required></select></label>
                        </div>
                        <button type="submit" class="primary">確認教學進度</button>
                    </fieldset>
                </form>
                <p class="notice" id="progressNotice" role="status"></p>
            </section>

            <section class="panel" aria-labelledby="queryHeading">
                <h2 id="queryHeading">逐字查詢</h2>
                <form id="queryForm">
                    <label for="query">輸入國字、詞語或一段文字</label>
                    <textarea id="query" rows="4" maxlength="200" placeholder="例如 烏雲密布"></textarea>
                    <div class="actions">
                        <button type="submit" class="primary">查詢國字</button>
                        <button type="button" id="showRecords" hidden>查看習寫紀錄</button>
                    </div>
                </form>
                <p class="hint">查詢文字與習寫紀錄只在此瀏覽器處理。</p>
            </section>
        </div>

        <section class="results-section" aria-labelledby="resultsHeading">
            <h2 id="resultsHeading" hidden>查詢結果</h2>
            <p class="notice" id="queryNotice" role="status"></p>
            <div id="results" class="results"></div>
        </section>
    </main>

    <template id="resultTemplate">
        <article class="result-card">
            <div class="character"><h3></h3><span class="count"></span></div>
            <div class="evidence">
                <h4>教材收錄</h4>
                <p class="first-occurrence"></p>
                <ul class="occurrences"></ul>
            </div>
            <div class="assessment">
                <h4>教學進度</h4>
                <p class="teaching-status"></p>
                <label>孩子的習寫狀態
                    <select class="writing-status">
                        <option value="not_assessed">尚未評估</option>
                        <option value="can_write">會寫</option>
                        <option value="cannot_write">不會寫</option>
                        <option value="uses_zhuyin">用注音代替</option>
                        <option value="missing_strokes">漏筆畫</option>
                    </select>
                </label>
                <details class="writing-history" hidden>
                    <summary>習寫紀錄</summary>
                    <ol></ol>
                </details>
                <p class="notice writing-notice" role="status"></p>
            </div>
        </article>
    </template>
</body>
</html>
