<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FAF8F4">
    <title>備份與還原｜生字練習簿</title>
    <link rel="stylesheet" href="learning.css">
    <script type="module" src="backup.mjs"></script>
    <link rel="stylesheet" href="task-layout.css" media="screen">
    <link rel="stylesheet" href="tokens.css" media="screen">
</head>
<body>
    <header class="page-header">
        <nav class="task-nav" aria-label="學習工具">
            <a href="vocabulary.html" data-workspace-link>老師詞庫</a>
            <a href="learning.html" data-workspace-link>國字查詢</a>
            <a href="index.html" data-workspace-link>首頁</a>
            <details class="task-nav-more">
                <summary>資料與設定</summary>
                <div class="task-nav-menu">
                    <a href="backup.html" aria-current="page">本機備份與還原</a>
                    <a href="sync.html">雲端同步</a>
                </div>
            </details>
        </nav>
    </header>
    <main>
        <h1>備份與還原</h1>
        <p class="intro">把班級詞庫、考卷、教學進度和習寫紀錄存成一個檔案。換裝置後，可在同一頁選檔還原。</p>
        <div class="panels">
            <section class="panel" aria-labelledby="exportHeading">
                <h2 id="exportHeading">下載備份</h2>
                <p id="currentSummary" class="notice"></p>
                <p class="hint">備份含有私人詞庫與學習紀錄，請保存在自己的裝置。</p>
                <p class="hint">教材資料檔請另外保留。還原後匯入相同版本的教材，就能繼續查詢先前的教學進度。</p>
                <div class="actions">
                    <button type="button" class="primary" id="downloadBackup">下載備份檔</button>
                </div>
                <p class="notice" id="exportNotice" role="status"></p>
            </section>
            <section class="panel" aria-labelledby="restoreHeading">
                <h2 id="restoreHeading">還原備份</h2>
                <label for="backupFile">選擇備份檔（JSON）</label>
                <input id="backupFile" name="backup-file" type="file" accept=".json,application/json" aria-describedby="restoreNotice">
                <p class="notice" id="restoreNotice" role="status"></p>
                <div class="actions">
                    <button type="button" class="primary" id="restoreBackup" hidden>還原這份備份</button>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
